name: qinglong_app
description: base on https://github.com/whyour/qinglong
publish_to: 'none'
version: 4.0.0+400

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

  # 状态管理
  flutter_riverpod: ^3.5.0

  # 网络
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0

  # 本地存储 / 工具
  shared_preferences: ^2.5.6
  synchronized: ^3.6.1+1
  path: ^1.9.1
  path_provider: ^2.1.6
  get_it: ^9.3.0
  logger: ^2.8.0
  intl: ^0.20.3
  date_format: ^2.0.9
  timezone: ^0.11.2

  # UI 组件
  cupertino_icons: ^2.0.0
  fluttertoast: ^10.0.2
  flutter_easyloading: ^4.0.2
  flutter_slidable: ^5.2.0
  flip_card: ^0.7.0
  cached_network_image: ^4.0.7
  lottie: ^3.8.2
  loading_animation_widget: ^1.3.0
  extended_text: ^15.0.2
  custom_sliding_segmented_control: ^2.0.0
  flutter_colorpicker: ^1.1.0
  flutter_keyboard_visibility: ^7.0.1
  back_button_interceptor: ^8.0.5

  # 能力
  file_picker: ^13.4.0
  permission_handler: ^13.0.2
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  local_auth: ^3.0.2
  quick_actions: ^1.1.1
  in_app_review: ^2.0.12
  move_to_bg: ^1.0.1
  icloud_storage_plus: ^4.4.0
  flutter_displaymode: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/scan.json
    - assets/images/
    - assets/codemirror.html

flutter_app_name:
  name: "青龙客户端"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ic_launcher.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/ic_launcher_foreground.png"
  min_sdk_android: 24
  remove_alpha_ios: true

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/ql.png
  color_dark: "#000000"
  image_dark: assets/images/ql_dark.png
  fullscreen: false
  android_12:
    color: "#ffffff"
    image: assets/images/ic_launcher_foreground.png
    color_dark: "#000000"
    image_dark: assets/images/ic_launcher_foreground.png
