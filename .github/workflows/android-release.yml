name: Android 正式发布

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号，例如 1.0.1 或 v1.0.1；填写 auto 会自动递增 Patch 版本"
        required: true
        default: auto

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.3.10"

jobs:
  release-apk:
    name: 构建并发布 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          # 手动发布 auto 版本时需要读取完整 tag 历史。
          fetch-depth: 0

      - name: 计算发布版本
        id: version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"

          # 统一去掉 v/V 前缀，内部版本号使用纯数字三段式。
          clean_version() { echo "$1" | sed 's/^[vV]//'; }

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # 推荐方式：推送 v1.2.3 标签后，直接按标签版本发布。
            VERSION=$(clean_version "${GITHUB_REF_NAME}")
          elif [[ -n "$INPUT_VERSION" && "$INPUT_VERSION" != "auto" ]]; then
            # 手动发布：使用输入的版本号。
            VERSION=$(clean_version "$INPUT_VERSION")
          else
            # 手动发布 auto：读取最新 v* 稳定版本标签，并递增 Patch。
            git fetch --tags --force
            LATEST_VERSION=$(git tag -l "v*" | sed 's/^[vV]//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
            if [[ "$LATEST_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            else
              VERSION="1.0.0"
            fi
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本号格式不正确：$VERSION"
            echo "请使用 1.2.3 或 v1.2.3 这类三段式版本号。"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_file=qinglong_app-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "本次发布版本：v${VERSION}"

      - name: 安装 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: 安装 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 解码 Android 签名文件
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "未配置 Android 签名文件，将使用兜底签名完成构建。"
            exit 0
          fi

          mkdir -p android/app
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/app/release.keystore
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Android 签名文件已解码。"

      - name: 安装 Flutter 依赖
        run: flutter pub get

      - name: 构建 Release APK
        env:
          ANDROID_KEYSTORE_PATH: android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.enabled }}" = "true" ] && \
             [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] && \
             [ -n "${ANDROID_KEY_ALIAS}" ] && \
             [ -n "${ANDROID_KEY_PASSWORD}" ]; then
            echo "签名配置完整，将使用自定义 release 签名。"
          else
            echo "签名配置不完整，将使用兜底签名完成构建。"
            unset ANDROID_KEYSTORE_PATH
            unset ANDROID_KEYSTORE_PASSWORD
            unset ANDROID_KEY_ALIAS
            unset ANDROID_KEY_PASSWORD
          fi

          flutter build apk --release \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ github.run_number }}"

      - name: 整理 APK 文件名
        run: cp build/app/outputs/flutter-apk/app-release.apk "${{ steps.version.outputs.apk_file }}"

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          append_body: true
          body: |
            自动构建来源：`${{ github.ref_name }}`
            提交：`${{ github.sha }}`
            版本：`${{ steps.version.outputs.tag }}`
          files: ${{ steps.version.outputs.apk_file }}
