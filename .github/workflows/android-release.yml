name: Android Release (APK)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.3.10"
          channel: "stable"
          cache: true

      - name: Decode keystore (optional)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No keystore secret found, fallback to unsigned/debug-sign release build."
            exit 0
          fi
          mkdir -p android/app
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/app/release.keystore
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build signed APK (release)
        env:
          ANDROID_KEYSTORE_PATH: android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.enabled }}" = "true" ] && \
             [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] && \
             [ -n "${ANDROID_KEY_ALIAS}" ] && \
             [ -n "${ANDROID_KEY_PASSWORD}" ]; then
            echo "Building with custom release signing."
          else
            echo "Building without custom signing secrets (fallback build)."
            unset ANDROID_KEYSTORE_PATH
            unset ANDROID_KEYSTORE_PASSWORD
            unset ANDROID_KEY_ALIAS
            unset ANDROID_KEY_PASSWORD
          fi
          flutter build apk --release

      - name: Prepare asset name
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            RELEASE_NAME="${GITHUB_REF_NAME}"
            PRERELEASE="false"
          else
            TAG="latest"
            RELEASE_NAME="Latest Build (${GITHUB_SHA::7})"
            PRERELEASE="true"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          cp build/app/outputs/flutter-apk/app-release.apk "qinglong_app-${TAG}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.name }}
          prerelease: ${{ steps.vars.outputs.prerelease }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          append_body: true
          body: |
            Auto build from `${{ github.ref_name }}` at `${{ github.sha }}`.
          files: qinglong_app-${{ steps.vars.outputs.tag }}.apk

